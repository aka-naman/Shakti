<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agra-sandhani Technical Documentation & Reference</title>
    <!-- CSS Design Tokens and Layout -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- App Container -->
    <div class="docs-container">
        
        <!-- Sidebar Navigation -->
        <aside class="docs-sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" width="28" height="28">
                        <path d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z" fill="currentColor"/>
                    </svg>
                    <span class="logo-text">Agra-sandhani</span>
                </div>
                <div class="sidebar-version">v1.0.0 (Offline)</div>
                
                <!-- Quick Search Panel -->
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search documentation..." autocomplete="off">
                    <button id="search-clear" class="search-clear-btn" style="display:none;">&times;</button>
                </div>
            </div>

            <!-- Navigation Links Tree -->
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Navigation menu will be dynamically rendered here -->
            </nav>
            
            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <span>© DRDO Airgapped Security</span>
            </div>
        </aside>

        <!-- Sidebar Mobile Toggle Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main Content Area -->
        <main class="docs-main">
            <!-- Top Utility Bar -->
            <header class="docs-header">
                <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Navigation Menu">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
                        </svg>
                    </button>
                    <!-- Breadcrumbs -->
                    <nav class="breadcrumbs" id="breadcrumbs">
                        <a href="#welcome">Docs</a> &raquo; <span>System Overview</span>
                    </nav>
                </div>
                
                <div class="header-right">
                    <!-- Theme Selector -->
                    <div class="theme-selector">
                        <label for="theme-select">Theme:</label>
                        <select id="theme-select">
                            <option value="classic">Python Classic</option>
                            <option value="rtd">Read the Docs</option>
                            <option value="dark">Obsidian Dark</option>
                        </select>
                    </div>
                </div>
            </header>

            <!-- Scrollable Content Container -->
            <div class="content-wrapper">
                
                <!-- Main Body -->
                <article class="content-body" id="content-body">
                    <div class="content-inner" id="content-inner">
                        <!-- Page content will be rendered here dynamically -->
                    </div>
                    
                    <!-- Content Footer (Navigation buttons) - Now inside scroll container! -->
                    <footer class="docs-footer">
                        <div class="nav-links">
                            <a href="#" class="nav-link prev-link" id="prev-link" style="visibility:hidden;">
                                <span class="nav-label">&laquo; Previous</span>
                                <span class="nav-title" id="prev-title">Previous Page</span>
                            </a>
                            <a href="#" class="nav-link next-link" id="next-link" style="visibility:hidden;">
                                <span class="nav-label">Next &raquo;</span>
                                <span class="nav-title" id="next-title">Next Page</span>
                            </a>
                        </div>
                        <hr class="footer-divider">
                        <div class="footer-meta">
                            <p>Built with vanilla HTML, CSS, and JS. Designed for secure offline airgapped operation.</p>
                        </div>
                    </footer>
                </article>

                <!-- On-This-Page Table of Contents (Right Sidebar) -->
                <aside class="page-outline">
                    <div class="outline-container">
                        <h3>On this page</h3>
                        <nav id="outline-nav">
                            <!-- Scroll spy headers will be rendered here -->
                        </nav>
                    </div>
                </aside>
                
            </div>
        </main>
    </div>

    <!-- Data & Script files -->
    <script src="content.js"></script>
    <script src="script.js"></script>
</body>
</html>
