<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAKTI | Unified Portal</title>
    <style>
        :root {
            --gold: #d4af37;
            --myth-dark: #010409;
            --text-primary: #f5f5f5;
            --text-secondary: #b0b0b0;
            --bg-card: #0d1117;
            --border-color: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--myth-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--gold);
            background-color: #161b22;
        }

        .icon-circle {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .card p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .cta-btn {
            padding: 12px 24px;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            background: transparent;
            align-self: center;
            border-radius: 4px;
        }

        .card:hover .cta-btn {
            background: var(--gold);
            color: var(--myth-dark);
        }

        .footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 2.5rem; }
            .card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SHAKTI</h1>
        <div class="subtitle">Unified Workspace</div>
    </div>

    <div class="container">
        <!-- Agra Sandhani Card -->
        <a href="#" id="agra-link" class="card">
            <div class="icon-circle">🧿</div>
            <h2>अग्र-Sandhani</h2>
            <p>Digital Records Archive & Management System</p>
            <div class="cta-btn">Open Application</div>
        </a>

        <!-- Noting Builder Card -->
        <a href="#" id="noting-link" class="card">
            <div class="icon-circle">🖋️</div>
            <h2>Noting Builder</h2>
            <p>Digital File Noting & Decision Support System</p>
            <div class="cta-btn">Open Application</div>
        </a>
    </div>

    <div class="footer">
        <p>AeroForm Automatrix &bull; 2026</p>
    </div>

    <script>
        async function init() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                
                const agraUrl = `http://${config.ip}:${config.agraPort}`;
                const notingUrl = `http://${config.ip}:${config.notingPort}`;
                
                document.getElementById('agra-link').href = agraUrl;
                document.getElementById('noting-link').href = notingUrl;
            } catch (e) {
                console.error('Portal connection failed:', e);
                document.getElementById('agra-link').href = 'http://localhost:5000';
                document.getElementById('noting-link').href = 'http://localhost:5001';
            }
        }
        init();
    </script>
</body>
</html>
